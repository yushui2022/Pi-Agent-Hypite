<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pi × Hypit · 制作工作台</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body class="workspace-ui"><aside class="sidebar"><a class="brand" href="/">p<span>i</span> / hypit<small>VIDEO WORKSPACE</small></a><div class="workspace-label">本地工作空间</div><button class="nav active" id="tasks-nav">▦ <span>制作任务</span><span id="nav-count" hidden>0</span></button><button class="nav" id="services-nav">◇ <span>服务连接</span><span class="dot"></span></button><div class="sidebar-bottom"><div class="avatar">本</div><div>本地工作站<small>资料保存在此电脑</small></div></div></aside>
<main><header><span>工作空间 <b>/</b> <span id="breadcrumb">制作任务</span></span><div class="header-tools"><span class="local"><i></i> 本地模式</span><select id="theme" aria-label="界面主题"><option value="system">跟随系统</option><option value="light">浅色主题</option><option value="dark">深色主题</option></select></div></header><div id="message" role="status" hidden></div><section id="content" aria-live="polite"></section><footer>PI AGENT × HYPIT <span>把每一次制作，留作下一次的起点。</span></footer></main>
<dialog id="create-dialog" aria-labelledby="create-title"><form id="create-form"><div class="dialog-head"><div><p class="eyebrow">NEW PRODUCTION</p><h2 id="create-title">新建制作任务</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="关闭">×</button></div><p class="muted">先记录想法。素材与制作服务可以稍后补充。</p><label>任务名称 <input name="title" required maxlength="120" placeholder="例如：便携咖啡杯 · 英语产品演示"></label><div class="form-grid"><label>账号 / 项目<input name="account" placeholder="例如：生活方式账号"></label><label>目标语言<select name="language"><option>英语</option><option>中文</option><option>西班牙语</option><option>日语</option><option>待确定</option></select></label></div><label>商品与卖点<textarea name="product" rows="2" placeholder="已知的商品事实、可用卖点"></textarea></label><label>制作要求<textarea name="requirements" rows="3" placeholder="希望做什么内容？时长、风格、开场或要保留的表达"></textarea></label><div class="dialog-actions"><button class="primary" type="submit">创建任务</button></div><p id="form-error" class="error" role="alert"></p></form></dialog>
<dialog id="leave-dialog" aria-labelledby="leave-title"><h2 id="leave-title">保留未保存的修改？</h2><p class="muted">离开后，这次输入的修改将丢失。你可以继续编辑并保存。</p><div class="dialog-actions"><button id="discard">放弃修改并离开</button><button id="stay" class="primary">继续编辑</button></div></dialog></body></html>
